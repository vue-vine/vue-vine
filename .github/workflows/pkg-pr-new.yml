name: Publish Any Commit
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: pkg-new:publish
        # Workaround: pnpm dlx inherits trustPolicy from workspace (pnpm/pnpm#10988),
        # and `pnpm run` re-injects it into child env, overriding our override.
        # Call pnpx directly with env var unset to bypass both layers.
        run: >-
          npm_config_trust_policy=
          pnpx pkg-pr-new publish --pnpm
          './packages/compiler'
          './packages/language-service'
          './packages/language-server'
          './packages/vite-plugin'
          './packages/eslint-parser'
          './packages/eslint-plugin'
          './packages/eslint-config'
          './packages/nuxt-module'
          './packages/tsc'
          './packages/vue-vine'
          './packages/create-vue-vine'
          './packages/rspack-loader'
          './packages/rsbuild-plugin'
