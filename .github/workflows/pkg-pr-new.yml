name: Publish Any Commit
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: pkg-new:publish
        run: pnpm run pkg-new:publish
        env:
          # Workaround: pkg-pr-new's dep @octokit/plugin-paginate-rest@9.2.2
          # lost provenance attestation, triggering pnpm's trust downgrade check.
          # Safe to bypass here as this only affects the pnpx dlx sandbox.
          PNPM_CONFIG_CHECK_TRUST_DOWNGRADE: "false"
