name: Publish Any Commit
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm i

      - name: Build
        run: pnpm run build

      - name: pkg-new:publish
        # Workaround: pnpm dlx inherits trustPolicy from workspace (pnpm/pnpm#10988),
        # causing ERR_PNPM_TRUST_DOWNGRADE for pkg-pr-new's transitive dep
        # @octokit/plugin-paginate-rest@9.2.2 which lost provenance attestation.
        run: pnpm run pkg-new:publish
        env:
          npm_config_trust_policy: ""
