minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.6.0-rc.13'
  - '@vue/compiler-dom@3.6.0-rc.13'
  - '@vue/compiler-sfc@3.6.0-rc.13'
  - '@vue/compiler-ssr@3.6.0-rc.13'
  - '@vue/compiler-vapor@3.6.0-rc.13'
  - '@vue/reactivity@3.6.0-rc.13'
  - '@vue/runtime-core@3.6.0-rc.13'
  - '@vue/runtime-dom@3.6.0-rc.13'
  - '@vue/runtime-vapor@3.6.0-rc.13'
  - '@vue/server-renderer@3.6.0-rc.13'
  - '@vue/shared@3.6.0-rc.13'
  - vue@3.6.0-rc.13
# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off
shellEmulator: true

packages:
  - packages/*

overrides:
  '@typescript-eslint/eslint-plugin>typescript': npm:@typescript/typescript6@^6.0.2
  '@typescript-eslint/parser>typescript': npm:@typescript/typescript6@^6.0.2
  '@typescript-eslint/project-service>typescript': npm:@typescript/typescript6@^6.0.2
  '@typescript-eslint/type-utils>typescript': npm:@typescript/typescript6@^6.0.2
  '@typescript-eslint/typescript-estree>typescript': npm:@typescript/typescript6@^6.0.2
  '@typescript-eslint/utils>typescript': npm:@typescript/typescript6@^6.0.2

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  '@vscode/vsce-sign': true
  core-js: true
  esbuild: true
  keytar: true
  playwright-chromium: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  cli:
    '@changesets/cli': ^3.0.3
    '@clack/prompts': ^1.8.1
    '@typescript/native': npm:typescript@~7.0.2
    clerc: ^1.3.1
    consola: ^3.4.2
    debug: ^4.4.3
    del: ^9.0.1
    execa: ^10.2.0
    lint-staged: ^17.6.0
    ovsx: ^1.3.0
    pkg-dir: ^9.0.0
    rollup: ^4.64.12
    simple-git-hooks: ^2.14.0
    tree-kill: ^1.2.2
    tsdown: ^0.23.1
    tsx: ^4.23.15
    typescript: npm:@typescript/typescript6@^6.0.2
    yoctocolors: ^2.2.0
  compiler:
    '@babel/parser': ^8.0.7
    '@babel/types': ^8.0.6
    estree-walker: ^3.0.3
    get-tsconfig: ^4.14.3
    magic-string: ^1.4.3
    merge-source-map: ^1.1.0
    postcss: ^8.5.28
    postcss-selector-parser: ^7.1.7
    source-map-js: ^1.2.1
    ts-morph: ^28.0.0
  docs:
    oxc-minify: ^0.155.0
    shiki: ^4.5.0
    vitepress: ^2.0.0-alpha.20
    vitepress-plugin-group-icons: ^1.8.1
  icons:
    '@iconify-json/carbon': ^1.2.28
    '@iconify-json/logos': ^1.2.17
    '@iconify-json/mdi': ^1.2.3
    '@iconify-json/twemoji': ^1.2.5
  lint-libs:
