    vscode-css-languageservice: ^6.3.10
    vscode-html-languageservice: ^5.6.2
    vscode-languageserver-protocol: ^3.18.4
    vscode-languageserver-textdocument: ^1.0.15
    vscode-uri: ^3.2.0
  vue-libs:
    '@vue/compiler-core': &vue 3.6.0-rc.13
    '@vue/compiler-dom': *vue
    '@vue/compiler-ssr': *vue
    '@vue/compiler-vapor': *vue
    '@vue/language-core': &vue-lang-tools 3.3.8
