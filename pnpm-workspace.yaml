    '@vue/shared': *vue
    '@vue/test-utils': ^2.5.1
    '@vueuse/core': ^15.0.0
    pinia: ^4.1.0
    vue: *vue
    vue-router: ^5.3.1
    vue-tsc: *vue-lang-tools
